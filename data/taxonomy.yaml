# Справочник видов ремонтно-отделочных работ RepairCalc
# Версия 1.0. Таксономия построена по технологической последовательности ремонта:
# подготовка -> черновые работы -> инженерные системы -> чистовая отделка -> завершающие работы.
# Принципы классификации и правила разметки — в docs/taxonomy.md.

version: "1.0"

stages:
  prep: Подготовительные работы
  rough: Черновые работы
  engineering: Инженерные системы
  finish: Чистовая отделка
  final: Завершающие работы

work_types:
  - id: demolition
    name: Демонтаж
    stage: prep
    description: >-
      Снятие старых покрытий, обоев, плитки, штукатурки, демонтаж перегородок и дверей.
      Используются перфораторы, долота, пики, ломы, строительные мешки, средства для снятия обоев.

  - id: priming
    name: Грунтование поверхностей
    stage: prep
    description: >-
      Обработка стен, пола и потолка грунтовкой перед штукатуркой, шпаклёвкой, покраской,
      поклейкой обоев, укладкой плитки и стяжкой. Грунтовки глубокого проникновения,
      бетонконтакт, антисептики, валики и кюветы для грунта.

  - id: screed
    name: Устройство стяжки пола
    stage: rough
    description: >-
      Выравнивание основания пола цементно-песчаной смесью, пескобетоном, полусухой стяжкой.
      Маяки, демпферная лента, армирующая сетка, правило, бетономешалка.

  - id: self_leveling
    name: Наливной пол
    stage: rough
    description: >-
      Финишное выравнивание пола самонивелирующимися смесями. Наливной пол, игольчатый валик,
      ракель, грунтовка, демпферная лента.

  - id: plastering
    name: Штукатурка стен и потолков
    stage: rough
    description: >-
      Выравнивание стен гипсовой или цементной штукатуркой по маякам. Штукатурные смеси,
      штукатурные маяки, уголки, сетка, правило, сокол, кельма.

  - id: drywall
    name: Монтаж гипсокартона
    stage: rough
    description: >-
      Устройство перегородок, обшивка стен и потолков листами ГКЛ, ГКЛВ, ГКЛО на металлическом
      каркасе. Профили ПП и ПН, прямые подвесы, соединители, саморезы по металлу и ГКЛ, дюбель-гвозди,
      уплотнительная лента, серпянка.

  - id: puttying
    name: Шпаклевание
    stage: rough
    description: >-
      Заделка швов и выравнивание под чистовую отделку. Стартовая и финишная шпаклёвка,
      серпянка, шпатели, шлифовальная сетка и бумага, тёрки.

  - id: waterproofing
    name: Гидроизоляция
    stage: rough
    description: >-
      Защита от протечек в санузлах, на балконах, в душевых зонах. Обмазочная и рулонная
      гидроизоляция, мастики, гидроизоляционные ленты и манжеты для углов и труб.

  - id: insulation
    name: Утепление и звукоизоляция
    stage: rough
    description: >-
      Утепление стен, пола, потолка, балконов и лоджий, звукоизоляция перегородок.
      Минеральная вата, пенополистирол, экструдированный пенополистирол, пароизоляция,
      тарельчатые дюбели, клей для утеплителя.

  - id: electrical_wiring
    name: Электромонтаж (прокладка проводки)
    stage: engineering
    description: >-
      Прокладка электрической проводки и сборка щита. Кабель ВВГнг, гофротруба, кабель-канал,
      распаечные и установочные коробки, подрозетники, клеммы, автоматические выключатели,
      УЗО, щиты, штроборезы.

  - id: electrical_fittings
    name: Установка электрофурнитуры и освещения
    stage: engineering
    description: >-
      Установка розеток, выключателей, рамок, светильников, люстр, точечных светильников,
      ламп и светодиодных лент.

  - id: plumbing
    name: Сантехнические работы
    stage: engineering
    description: >-
      Разводка водоснабжения и канализации, установка сантехники. Полипропиленовые трубы и фитинги,
      канализационные трубы, краны, смесители, унитазы, раковины, ванны, душевые, инсталляции, сифоны.

  - id: heating
    name: Отопление и тёплый пол
    stage: engineering
    description: >-
      Монтаж радиаторов отопления и тёплого пола. Нагревательные маты и кабели,
      терморегуляторы, радиаторы, кронштейны, полотенцесушители.

  - id: ventilation
    name: Вентиляция
    stage: engineering
    description: >-
      Вентиляция санузлов, кухонь и жилых комнат. Вытяжные вентиляторы, вентиляционные решётки,
      воздуховоды, обратные клапаны.

  - id: tiling
    name: Укладка плитки
    stage: finish
    description: >-
      Облицовка стен и пола керамической плиткой и керамогранитом. Плитка, керамогранит,
      мозаика, плиточный клей, затирка для швов, крестики, система выравнивания плитки (СВП),
      зубчатые шпатели, плиткорезы.

  - id: painting
    name: Покраска стен и потолков
    stage: finish
    description: >-
      Окраска стен и потолков водно-дисперсионными и интерьерными красками. Краски, колеровка,
      валики, кисти, малярные кюветы, малярный скотч, укрывная плёнка, стеклохолст и малярный флизелин.

  - id: wallpapering
    name: Поклейка обоев
    stage: finish
    description: >-
      Оклейка стен обоями. Флизелиновые, виниловые, бумажные обои и обои под покраску,
      обойный клей, прижимные валики, обойные шпатели, ножи.

  - id: decorative_finish
    name: Декоративная отделка стен
    stage: finish
    description: >-
      Декоративная штукатурка, микроцемент, венецианская штукатурка, лепнина и молдинги,
      декоративный камень, лессирующие составы.

  - id: laminate
    name: Укладка ламината и замковых покрытий
    stage: finish
    description: >-
      Укладка ламината, паркетной доски, кварцвинила SPC с замковым соединением. Подложка,
      клинья, пароизоляционная плёнка.

  - id: soft_flooring
    name: Укладка линолеума и ковролина
    stage: finish
    description: >-
      Укладка рулонных напольных покрытий. Линолеум, ковролин, клей для линолеума,
      двусторонний скотч, холодная сварка швов.

  - id: ceiling
    name: Монтаж потолков
    stage: finish
    description: >-
      Устройство подвесных, реечных и панельных потолков. Потолочная плитка, панели ПВХ, реечный
      потолок, кассетный потолок, потолочный плинтус и галтели.

  - id: wall_panels
    name: Монтаж стеновых панелей
    stage: finish
    description: >-
      Облицовка стен панелями ПВХ, МДФ, реечными панелями. Кляймеры, стартовые и угловые профили,
      клей-монтаж.

  - id: doors
    name: Установка дверей
    stage: final
    description: >-
      Монтаж межкомнатных и входных дверей. Дверные полотна, коробки, наличники, доборы,
      петли, ручки, замки, монтажная пена.

  - id: windows_slopes
    name: Подоконники и откосы
    stage: final
    description: >-
      Установка подоконников и отделка оконных откосов. Подоконники ПВХ, откосные панели,
      заглушки, монтажная пена, герметики.

  - id: skirting
    name: Монтаж плинтусов и порогов
    stage: final
    description: >-
      Установка напольных плинтусов и порогов. Плинтусы ПВХ и МДФ, заглушки, углы, соединители,
      порожки, клипсы.

  - id: sealing
    name: Герметизация швов и стыков
    stage: final
    description: >-
      Герметизация стыков сантехники, окон, швов. Санитарные и акриловые герметики,
      монтажная пена, пистолеты для пены и герметика, уплотнители.

# Классы материала (вид товара) — второй уровень разметки. Нужен калькулятору:
# по классу выбирается формула расхода. Список в app/core/kinds.py.

# Специфика помещений: используется движком рекомендаций.
rooms:
  living:     {name: Гостиная,  humidity: low,    traffic: medium, wet: false}
  bedroom:    {name: Спальня,   humidity: low,    traffic: low,    wet: false}
  kids:       {name: Детская,   humidity: low,    traffic: high,   wet: false, eco: true}
  kitchen:    {name: Кухня,     humidity: medium, traffic: high,   wet: false, grease: true}
  bathroom:   {name: Санузел (ванная), humidity: high, traffic: medium, wet: true}
  toilet:     {name: Туалет,    humidity: medium, traffic: medium, wet: true}
  hallway:    {name: Прихожая / коридор, humidity: low, traffic: high, wet: false}
  balcony:    {name: Балкон / лоджия,    humidity: medium, traffic: low, wet: false, cold: true}

object_types:
  apartment: Квартира
  studio: Студия
  house: Дом

repair_types:
  cosmetic: Косметический
  capital: Капитальный
  designer: Дизайнерский
